<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilipeCams</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 160'%3E%3Crect width='200' height='160' fill='black'/%3E%3Cg fill='none' stroke='white' stroke-width='8'%3E%3Crect x='10' y='28' width='180' height='120' rx='18'/%3E%3Ccircle cx='100' cy='98' r='40'/%3E%3C/g%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }

        /* Contentor do visor da câmara */
        .viewer-container { position: relative; flex: 1; width: 100%; max-height: calc(100vh - 160px); background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        video { width: 100%; height: 100%; object-fit: cover; }
        /* Aplica o efeito espelho apenas na câmara frontal */
        video.mirror { transform: scaleX(-1); }

        /* Animação do Flash ao tirar a foto */
        .flash-effect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; opacity: 0; z-index: 5; pointer-events: none; }
        .flash-effect.active { animation: flashAnim 0.3s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

        /* Indicador de Gravação Ativa */
        .recording-badge { position: absolute; top: 20px; left: 20px; background: rgba(255, 0, 0, 0.8); color: white; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; display: none; align-items: center; gap: 6px; z-index: 6; }

        /* Seletor de Modo (Foto / Vídeo) */
        .mode-selector { height: 40px; background: #000; display: flex; justify-content: center; align-items: center; gap: 30px; z-index: 10; }
        .mode-btn { background: none; border: none; color: #888; font-weight: bold; font-size: 14px; cursor: pointer; letter-spacing: 1px; }
        .mode-btn.active { color: #ffcc00; }

        /* Barra de Controlos Inferior (Estilo App Nativa) */
        .bottom-bar { height: 120px; background: rgba(0, 0, 0, 0.95); display: flex; align-items: center; justify-content: space-around; padding: 0 20px; z-index: 10; border-top: 1px solid #1a1a1a; }

        /* Botão do Obturador (Tirar Foto / Gravar) */
        .shutter-btn { width: 70px; height: 70px; border-radius: 50%; background: #ffffff; border: 5px solid #000000; box-shadow: 0 0 0 4px #ffffff; cursor: pointer; transition: all 0.2s; }
        .shutter-btn:active { transform: scale(0.9); }
        .shutter-btn.video-mode { background: #ff3b30; }
        .shutter-btn.recording { background: #ff3b30; border-radius: 20%; width: 55px; height: 55px; }

        /* Botão para alternar entre câmaras (Frontal/Traseira) */
        .flip-btn { width: 45px; height: 45px; border-radius: 50%; background: #222222; border: none; color: #ffffff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        /* Miniatura da Galeria (Última Foto) com Contador */
        .gallery-preview { width: 45px; height: 45px; border-radius: 8px; background: #222222; border: 2px solid #ffffff; background-size: cover; background-position: center; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; }
        .folder-badge { position: absolute; bottom: -6px; right: -6px; background: #007aff; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid white; }

        /* Ecrã de Inicialização para contornar bloqueios locais */
        .init-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; gap: 20px; }
        .logo { width: 140px; height: auto; color: #ffffff; }
        .brand { font-size: 28px; letter-spacing: 1px; }
        .init-btn { background: #ffffff; color: #000000; border: none; padding: 15px 40px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; }

        /* Modal da Pasta de Fotos */
        .gallery-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 200; display: none; flex-direction: column; color: white; }
        .gallery-header { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
        .close-gallery { background: none; border: none; color: #007aff; font-size: 16px; font-weight: bold; cursor: pointer; }
        .gallery-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; overflow-y: auto; align-content: start; }
        .gallery-item { width: 100%; aspect-ratio: 1; background-size: cover; background-position: center; position: relative; background-color: #111; cursor: pointer; }
        .video-icon { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; font-size: 10px; }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- Janela inicial para forçar a permissão do browser -->
    <div id="initOverlay" class="init-overlay">
        <svg class="logo" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round" aria-label="FilipeCams">
            <rect x="70" y="8" width="60" height="22" rx="4"/>
            <rect x="42" y="14" width="16" height="12" rx="3" fill="currentColor"/>
            <rect x="142" y="14" width="14" height="12" rx="3" fill="currentColor"/>
            <rect x="10" y="28" width="180" height="120" rx="18"/>
            <rect x="142" y="58" width="34" height="14" rx="4" stroke-width="6"/>
            <circle cx="100" cy="98" r="48" stroke-width="6"/>
            <circle cx="100" cy="98" r="34" stroke-width="12"/>
            <circle cx="100" cy="98" r="18" stroke-width="4"/>
            <circle cx="112" cy="86" r="6" fill="currentColor" stroke="none"/>
            <circle cx="86" cy="106" r="3" fill="currentColor" stroke="none"/>
        </svg>
        <h2 class="brand">FilipeCams</h2>
        <p style="color: #666; font-size: 14px; text-align: center; padding: 0 20px;">Clique abaixo para inicializar o hardware de vídeo e áudio do dispositivo.</p>
        <button class="init-btn" onclick="startApp()">Abrir Câmara</button>
    </div>

    <!-- Visor Principal -->
    <div class="viewer-container">
        <div id="recBadge" class="recording-badge">🔴 <span id="recTime">00:00</span></div>
        <div id="flash" class="flash-effect"></div>
        <video id="cameraView" autoplay playsinline class="mirror"></video>
    </div>

    <!-- Seletor de Modos -->
    <div class="mode-selector">
        <button id="modeFoto" class="mode-btn active" onclick="changeMode('foto')">FOTO</button>
        <button id="modeVideo" class="mode-btn" onclick="changeMode('video')">VÍDEO</button>
    </div>

    <!-- Interface Estilo iOS/Android -->
    <div class="bottom-bar">
        <!-- Esquerda: Miniatura da última foto com contador da pasta -->
        <div id="preview" class="gallery-preview" onclick="openGallery()">
            <span id="folderIcon" style="font-size: 18px;">📁</span>
            <div id="folderCount" class="folder-badge">0</div>
        </div>
        
        <!-- Centro: Botão de disparo dinâmico -->
        <button id="shutter" class="shutter-btn" onclick="handleAction()"></button>
        
        <!-- Direita: Alternador de câmara (Frontal/Traseira) -->
        <button class="flip-btn" onclick="switchCamera()">🔄</button>
    </div>

    <!-- Janela da Pasta / Galeria -->
    <div id="galleryModal" class="gallery-modal">
        <div class="gallery-header">
            <h3>Pasta: 📁 Fotos FilipeCams</h3>
            <button class="close-gallery" onclick="closeGallery()">Concluído</button>
        </div>
        <div id="galleryGrid" class="gallery-grid"></div>
    </div>

    <canvas id="captureCanvas"></canvas>

    <script>
        let currentStream = null;
        let useFrontCamera = true;
        let currentMode = 'foto'; 
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordTimer = null;
        let recordSeconds = 0;
        
        // Array local que simula a pasta local/galeria de fotos guardadas
        let virtualFolder = [];

        // Inicia a aplicação após o clique do utilizador
        async function startApp() {
            document.getElementById('initOverlay').style.display = 'none';
            await initCamera();
        }

        // Configura e liga o fluxo de vídeo e áudio juntos
        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const video = document.getElementById('cameraView');
            const mode = useFrontCamera ? "user" : "environment";

            try {
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: mode },
                        audio: true
                    });
                } catch (e) {
                    // Se o microfone falhar, tenta só com vídeo (fotos continuam a funcionar)
                    currentStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: mode },
                        audio: false
                    });
                }
                video.srcObject = currentStream;
                video.muted = true;
                video.classList.toggle('mirror', useFrontCamera);
            } catch (err) {
                console.error("Erro de hardware:", err);
                let msg = "Não foi possível aceder à câmara.";
                if (err.name === 'NotAllowedError') {
                    msg = "Permissão negada. Clica no cadeado ao lado do endereço, permite a câmara e recarrega a página. Se abriste dentro de um pré-visualizador, abre o ficheiro diretamente no browser.";
                } else if (err.name === 'NotFoundError') {
                    msg = "Não foi encontrada nenhuma câmara neste dispositivo.";
                } else if (err.name === 'NotReadableError') {
                    msg = "A câmara está a ser usada por outra aplicação.";
                } else if (!window.isSecureContext) {
                    msg = "A câmara só funciona em https:// ou localhost.";
                }
                alert(msg);
            }
        }

        // Alterna entre a câmara da frente e a de trás
        async function switchCamera() {
            if (isRecording) return;
            useFrontCamera = !useFrontCamera;
            await initCamera();
        }

        // Altera entre o modo Foto e Vídeo
        function changeMode(mode) {
            if (isRecording) return;
            currentMode = mode;
            const shutter = document.getElementById('shutter');
            
            document.getElementById('modeFoto').classList.toggle('active', mode === 'foto');
            document.getElementById('modeVideo').classList.toggle('active', mode === 'video');

            if (mode === 'video') {
                shutter.classList.add('video-mode');
            } else {
                shutter.classList.remove('video-mode');
            }
        }

        // Decide se tira foto ou controla o vídeo dependendo do modo ativo
        function handleAction() {
            if (currentMode === 'foto') {
                capturePhoto();
            } else {
                if (!isRecording) {
        
startRecording();
                } else {
                    stopRecording();
                }
            }
        }

        // Tira uma foto a partir do frame atual do vídeo
        function capturePhoto() {
            const video = document.getElementById('cameraView');
            if (!video.videoWidth) return;
            const canvas = document.getElementById('captureCanvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            if (useFrontCamera) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const flash = document.getElementById('flash');
            flash.classList.remove('active');
            void flash.offsetWidth;
            flash.classList.add('active');

            const url = canvas.toDataURL('image/jpeg', 0.92);
            addToFolder({ type: 'foto', url: url, name: 'FilipeCams_' + Date.now() + '.jpg' });
        }

        // Começa a gravar vídeo + áudio
        function startRecording() {
            if (!currentStream) return;
            recordedChunks = [];
            const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
            const mimeType = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
            try {
                mediaRecorder = mimeType ? new MediaRecorder(currentStream, { mimeType }) : new MediaRecorder(currentStream);
            } catch (err) {
                alert("Este browser não suporta gravação de vídeo.");
                return;
            }
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const type = mediaRecorder.mimeType || 'video/webm';
                const blob = new Blob(recordedChunks, { type: type });
                const ext = type.includes('mp4') ? 'mp4' : 'webm';
                addToFolder({ type: 'video', url: URL.createObjectURL(blob), name: 'FilipeCams_' + Date.now() + '.' + ext });
            };
            mediaRecorder.start();
            isRecording = true;

            document.getElementById('shutter').classList.add('recording');
            const badge = document.getElementById('recBadge');
            badge.style.display = 'flex';
            recordSeconds = 0;
            document.getElementById('recTime').textContent = '00:00';
            recordTimer = setInterval(() => {
                recordSeconds++;
                const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
                const s = String(recordSeconds % 60).padStart(2, '0');
                document.getElementById('recTime').textContent = m + ':' + s;
            }, 1000);
        }

        // Pára a gravação
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            isRecording = false;
            clearInterval(recordTimer);
            document.getElementById('shutter').classList.remove('recording');
            document.getElementById('recBadge').style.display = 'none';
        }

        // Adiciona à pasta virtual e atualiza a miniatura
        function addToFolder(item) {
            virtualFolder.unshift(item);
            document.getElementById('folderCount').textContent = virtualFolder.length;
            if (item.type === 'foto') {
                const preview = document.getElementById('preview');
                preview.style.backgroundImage = 'url(' + item.url + ')';
                document.getElementById('folderIcon').style.display = 'none';
            }
        }

        // Galeria
        function openGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            if (virtualFolder.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #666; padding: 40px 0;">Ainda não há fotos nem vídeos.</p>';
            }
            virtualFolder.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                if (item.type === 'foto') {
                    div.style.backgroundImage = 'url(' + item.url + ')';
                } else {
                    div.innerHTML = '<video src="' + item.url + '" muted playsinline style="width:100%;height:100%;object-fit:cover;"></video><span class="video-icon">▶ Vídeo</span>';
                }
                div.onclick = () => {
                    const a = document.createElement('a');
                    a.href = item.url;
                    a.download = item.name;
                    a.click();
                };
                grid.appendChild(div);
            });
            document.getElementById('galleryModal').style.display = 'flex';
        }

        function closeGallery() {
            document.getElementById('galleryModal').style.display = 'none';
        }
    </script>
</body>
</html>
