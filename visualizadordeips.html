<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplica Opal</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #0b1220;
            color: #edf3ff;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 900px;
            margin: auto;
        }

        .panel {
            background: #121c2e;
            border: 1px solid #2a3952;
            border-radius: 14px;
            padding: 20px;
            margin-top: 20px;
        }

        input, button {
            padding: 12px;
            margin: 5px 0;
            border-radius: 8px;
            font-size: 16px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            color: white;
            background: #0b1424;
            border: 1px solid #354761;
        }

        button {
            border: 0;
            background: #65a9ff;
            color: #071326;
            cursor: pointer;
            font-weight: bold;
        }

        #estado {
            color: #aab8cf;
            overflow-wrap: anywhere;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: 0;
            border-radius: 10px;
            background: #080e18;
        }

        .nota {
            color: #aab8cf;
            font-size: 14px;
        }
    </style>
</head>

<body>
<main>
    <h1>Aplica Opal</h1>
    <p>Ligação ao servidor e acesso à câmara IP.</p>

    <section class="panel">
        <h2>Estado do servidor</h2>
        <p id="estado">A estabelecer ligação...</p>
    </section>

    <section class="panel">
        <h2>Ligar à câmara IP</h2>

        <label for="ip">Endereço IP ou hostname da câmara</label>
        <input
            id="ip"
            type="text"
            placeholder="Ex.: 192.168.1.50"
            autocomplete="url"
        >

        <label for="porta">Porta web (opcional)</label>
        <input
            id="porta"
            type="number"
            min="1"
            max="65535"
            placeholder="Ex.: 80"
        >

        <button id="ligar">Abrir câmara</button>

        <p id="estadoCamera" class="nota">
            Introduz o endereço da tua câmara.
        </p>
    </section>

    <section class="panel">
        <h2>Interface da câmara</h2>
        <div id="visualizacao">
            <p class="nota">
                A interface da câmara aparecerá aqui se permitir
                a incorporação no navegador.
            </p>
        </div>
    </section>

    <section class="panel">
        <h2>Comunicação com o servidor</h2>
        <button id="ping">Testar ligação</button>
        <p id="resultadoPing" class="nota"></p>
    </section>
</main>

<script>
    const estado = document.getElementById("estado");
    const estadoCamera = document.getElementById("estadoCamera");
    const visualizacao = document.getElementById("visualizacao");
    const resultadoPing = document.getElementById("resultadoPing");

    // Liga ao Socket.IO servido pelo próprio servidor Node.js.
    const socket = io();

    socket.on("connect", () => {
        estado.textContent = "Ligado ao servidor. ID: " + socket.id;
    });

    socket.on("disconnect", () => {
        estado.textContent = "Ligação ao servidor perdida.";
    });

    socket.on("connect_error", () => {
        estado.textContent = "Não foi possível ligar ao servidor.";
    });

    // Abre a interface web da câmara indicada pelo utilizador.
    document.getElementById("ligar").addEventListener("click", () => {
        let host = document.getElementById("ip").value.trim();
        const porta = document.getElementById("porta").value.trim();

        if (!host) {
            estadoCamera.textContent =
                "Introduz o endereço da câmara.";
            return;
        }

        // Aceita um endereço IP/hostname ou URL HTTP(S).
        let url;

        try {
            if (/^https?:\/\//i.test(host)) {
                url = new URL(host);
            } else {
                if (/[\/\s]/.test(host)) {
                    throw new Error("Endereço inválido.");
                }

                url = new URL("http://" + host);
            }

            if (url.protocol !== "http:" &&
                url.protocol !== "https:") {
                throw new Error("Usa um endereço HTTP ou HTTPS.");
            }

            if (porta) {
                const n = Number(porta);

                if (!Number.isInteger(n) || n < 1 || n > 65535) {
                    throw new Error("Porta inválida.");
                }

                url.port = String(n);
            }
        } catch (error) {
            estadoCamera.textContent =
                error.message || "Endereço inválido.";
            return;
        }

        visualizacao.replaceChildren();

        const frame = document.createElement("iframe");
        frame.title = "Interface web da câmara";
        frame.referrerPolicy = "no-referrer";
        frame.src = url.href;

        visualizacao.appendChild(frame);

        estadoCamera.textContent =
            "A tentar abrir " + url.href +
            ". Se não aparecer, abre o endereço num novo separador.";

        // Alternativa caso a câmara bloqueie a incorporação.
        const link = document.createElement("a");
        link.href = url.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Abrir câmara num novo separador";
        link.style.display = "inline-block";
        link.style.marginTop = "12px";
        link.style.color = "#65a9ff";

        visualizacao.appendChild(link);
    });

    // Testa a comunicação com o servidor.
    document.getElementById("ping").addEventListener("click", () => {
        if (!socket.connected) {
            resultadoPing.textContent =
                "O servidor não está ligado.";
            return;
        }

        const inicio = performance.now();

        socket.timeout(5000).emit("ping:latency", (error) => {
            if (error) {
                resultadoPing.textContent =
                    "O servidor não respondeu ao teste.";
                return;
            }

            const ms = Math.round(performance.now() - inicio);

            resultadoPing.textContent =
                "Servidor respondeu. Latência aproximada: " + ms + " ms.";
        });
    });
</script>
</body>
</html>
