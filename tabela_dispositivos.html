<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura de Raiz</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; }
        
        /* Estilização da Tabela de Raiz */
        .minha-tabela {
            width: 100%;
            border-collapse: collapse; /* Une as bordas das células numa linha única */
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .minha-tabela th {
            background-color: #1e293b;
            color: #ffffff;
            text-align: left;
            padding: 12px 16px;
            font-size: 14px;
        }

        .minha-tabela td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
            font-size: 13px;
        }

        /* Efeito visual ao passar o rato na linha */
        .minha-tabela tr:hover {
            background-color: #f8fafc;
        }
    </style>
</head>
<body>

    <table class="minha-tabela">
        <thead>
            <tr>
                <th>ID Periférico</th>
                <th>Tipo de Equipamento</th>
                <th>Endereço IP</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>PRN-01</td>
                <td>Impressora Laser</td>
                <td>192.168.1.50</td>
                <td>Ativo</td>
            </tr>
            <tr>
                <td>SCN-02</td>
                <td>Scanner Industrial</td>
                <td>192.168.1.60</td>
                <td>Em Espera</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
