<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo de Dispositivos</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --bg-color: #f4f6f9;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Formulário de Adicionar */
        .form-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .form-group input, .form-group select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95em;
        }

        /* Tabela */
        .table-container {
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-radius: 8px;
            overflow-x: auto;
        }

        h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        /* Interruptor Switch (Ligar/Desligar) */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--success-color);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Estado em Texto */
        .status-text {
            font-weight: bold;
            font-size: 0.9em;
            margin-left: 8px;
            vertical-align: super;
        }
        .text-on { color: var(--success-color); }
        .text-off { color: #7f8c8d; }

        /* Botões */
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-add { background-color: var(--primary-color); color: white; width: 100%; }
        .btn-add:hover { background-color: #1a252f; }
        .btn-delete { background-color: var(--danger-color); color: white; padding: 5px 10px; font-size: 0.85em; }
        .btn-delete:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Formulário para Adicionar Dispositivo -->
    <div class="form-container">
        <h3>+ Adicionar Novo Dispositivo</h3>
        <form id="deviceForm" class="form-grid">
            <div class="form-group">
                <label for="deviceName">Nome do Dispositivo</label>
                <input type="text" id="deviceName" placeholder="Ex: Lâmpada Sala" required>
            </div>
            <div class="form-group">
                <label for="deviceType">Tipo / Categoria</label>
                <select id="deviceType">
                    <option value="Iluminação">Iluminação</option>
                    <option value="Eletrodoméstico">Eletrodoméstico</option>
                    <option value="Segurança">Segurança</option>
                    <option value="Entretenimento">Entretenimento</option>
                </select>
            </div>
            <div class="form-group">
                <label for="deviceLocation">Localização</label>
                <input type="text" id="deviceLocation" placeholder="Ex: Cozinha" required>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-add">Adicionar</button>
            </div>
        </form>
    </div>

    <!-- Tabela de Controlo -->
    <div class="table-container">
        <h2>Painel de Gestão e Controlo</h2>
        <table id="deviceTable">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Localização</th>
                    <th>Controlo (On/Off)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Ar Condicionado</td>
                    <td>Eletrodoméstico</td>
                    <td>Quarto Principal</td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" checked onchange="toggleStatus(this)">
                            <span class="slider"></span>
                        </label>
                        <span class="status-text text-on">Ligado</span>
                    </td>
                    <td><button class="btn btn-delete" onclick="removeDevice(this)">Remover</button></td>
                </tr>
                <tr>
                    <td>Câmara Entrada</td>
                    <td>Segurança</td>
                    <td>Portão Exterior</td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" checked onchange="toggleStatus(this)">
                            <span class="slider"></span>
                        </label>
                        <span class="status-text text-on">Ligado</span>
                    </td>
                    <td><button class="btn btn-delete" onclick="removeDevice(this)">Remover</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Função para Ligar / Desligar (Mudar texto do estado)
    function toggleStatus(checkbox) {
        const statusText = checkbox.parentElement.nextElementSibling;
        if (checkbox.checked) {
            statusText.textContent = "Ligado";
            statusText.className = "status-text text-on";
        } else {
            statusText.textContent = "Desligado";
            statusText.className = "status-text text-off";
        }
    }

    // Função para Remover Dispositivo
    function removeDevice(button) {
        // Confirmação simples antes de apagar
        if (confirm("Tem a certeza que deseja remover este dispositivo?")) {
            const row = button.parentElement.parentElement;
            row.remove();
        }
    }

    // Evento para Adicionar Novo Dispositivo através do Formulário
    document.getElementById('deviceForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Impede a página de recarregar

        // Captura os valores dos inputs
        const name = document.getElementById('deviceName').value;
        const type = document.getElementById('deviceType').value;
        const location = document.getElementById('deviceLocation').value;
        
        const tableBody = document.querySelector('#deviceTable tbody');
        
        // Cria uma nova linha (tr)
        const newRow = document.createElement('tr');
        
        // Define o HTML interno da nova linha com o switch desligado por padrão
        newRow.innerHTML = `
            <td>${name}</td>
            <td>${type}</td>
            <td>${location}</td>
            <td>
                <label class="switch">
                    <input type="checkbox" onchange="toggleStatus(this)">
                    <span class="slider"></span>
                </label>
                <span class="status-text text-off">Desligado</span>
            </td>
            <td><button class="btn btn-delete" onclick="removeDevice(this)">Remover</button></td>
        `;
        
        // Adiciona a linha à tabela
        tableBody.appendChild(newRow);
        
        // Limpa o formulário
        document.getElementById('deviceForm').reset();
    });
</script>

</body>
</html>
