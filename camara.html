<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicação Câmara Nativa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }

        /* Contentor do visor da câmara */
        .viewer-container { position: relative; flex: 1; width: 100%; max-height: calc(100vh - 120px); background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        video { width: 100%; height: 100%; object-fit: cover; }
        /* Aplica o efeito espelho apenas na câmara frontal */
        video.mirror { transform: scaleX(-1); }

        /* Animação do Flash ao tirar a foto */
        .flash-effect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; opacity: 0; z-index: 5; pointer-events: none; }
        .flash-effect.active { animation: flashAnim 0.3s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

        /* Barra de Controlos Inferior (Estilo App Nativa) */
        .bottom-bar { height: 120px; background: rgba(0, 0, 0, 0.95); display: flex; align-items: center; justify-content: space-around; padding: 0 20px; z-index: 10; border-top: 1px solid #1a1a1a; }

        /* Botão do Obturador (Tirar Foto) */
        .shutter-btn { width: 70px; height: 70px; border-radius: 50%; background: #ffffff; border: 5px solid #000000; box-shadow: 0 0 0 4px #ffffff; cursor: pointer; transition: transform 0.1s; }
        .shutter-btn:active { transform: scale(0.9); background: #e2e8f0; }

        /* Botão para alternar entre câmaras (Frontal/Traseira) */
        .flip-btn { width: 45px; height: 45px; border-radius: 50%; background: #222222; border: none; color: #ffffff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        /* Miniatura da Galeria (Última Foto) */
        .gallery-preview { width: 45px; height: 45px; border-radius: 8px; background: #222222; border: 2px solid #ffffff; background-size: cover; background-position: center; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #555; font-size: 10px; }

        /* Ecrã de Inicialização para contornar bloqueios locais */
        .init-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; gap: 20px; }
        .init-btn { background: #ffffff; color: #000000; border: none; padding: 15px 40px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; }

        canvas { display: none; }
    </style>
</head>
<body>

    <!-- Janela inicial para forçar a permissão do browser -->
    <div id="initOverlay" class="init-overlay">
        <h2>Aplicação de Câmara</h2>
        <p style="color: #666; font-size: 14px; text-align: center; padding: 0 20px;">Clique abaixo para inicializar o hardware de vídeo do dispositivo.</p>
        <button class="init-btn" onclick="startApp()">Abrir Câmara</button>
    </div>

    <!-- Visor Principal -->
    <div class="viewer-container">
        <div id="flash" class="flash-effect"></div>
        <video id="cameraView" autoplay playsinline class="mirror"></video>
    </div>

    <!-- Interface Estilo iOS/Android -->
    <div class="bottom-bar">
        <!-- Esquerda: Miniatura da última foto tirada -->
        <div id="preview" class="gallery-preview">📁</div>
        
        <!-- Centro: Botão de disparo -->
        <button class="shutter-btn" onclick="capturePhoto()"></button>
        
        <!-- Direita: Alternador de câmara (Frontal/Traseira) -->
        <button class="flip-btn" onclick="switchCamera()">🔄</button>
    </div>

    <canvas id="captureCanvas"></canvas>

    <script>
        let currentStream = null;
        let useFrontCamera = true; // Define se começa na frontal ou traseira

        // Inicia a aplicação após o clique do utilizador
        async function startApp() {
            document.getElementById('initOverlay').style.display = 'none';
            await initCamera();
        }

        // Configura e liga o fluxo de vídeo
        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const video = document.getElementById('cameraView');
            // Altera o modo com base na seleção (user = frontal, environment = traseira)
            const mode = useFrontCamera ? "user" : "environment";

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: mode },
                    audio: false
                });
                video.srcObject = currentStream;

                // Aplica o efeito espelho apenas à câmara frontal para parecer natural
                if (useFrontCamera) {
                    video.classList.add('mirror');
                } else {
                    video.classList.remove('mirror');
                }
            } catch (err) {
                console.error("Erro de hardware:", err);
                alert("Não foi possível aceder à câmara. Certifica-te de que permitiste o acesso.");
            }
        }

        // Alterna entre a câmara da frente e a de trás
        async function switchCamera() {
            useFrontCamera = !useFrontCamera;
            await initCamera();
        }

        // Tira a fotografia e gera o efeito visual da app nativa
        function capturePhoto() {
            const video = document.getElementById('cameraView');
            const canvas = document.getElementById('captureCanvas');
            const flash = document.getElementById('flash');
            const preview = document.getElementById('preview');
            const context = canvas.getContext('2d');

            if (!video.srcObject) return;

            // Ativa o flash visual branco instantâneo
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 300);

            // Ajusta a resolução da captura para corresponder ao vídeo nativo
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Trata a inversão da imagem no canvas se for a câmara frontal
            if (useFrontCamera) {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }
            
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Converte o frame numa imagem de dados (Base64)
            const imageData = canvas.toDataURL('image/png');

            // Atualiza o canto inferior (Miniatura) com a foto que acabaste de tirar
            preview.style.backgroundImage = `url('${imageData}')`;
            preview.innerText = ''; // Remove o emoji de pasta

            // Descarrega automaticamente a fotografia para o computador
            const downloadLink = document.createElement('a');
            downloadLink.download = 'IMG_' + Date.now() + '.png';
            downloadLink.href = imageData;
            downloadLink.click();
        }
    </script>
</body>
</html>
