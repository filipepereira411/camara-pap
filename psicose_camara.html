<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psicose - Câmara & Canal</title>
  <style>
    :root {
      --bg-page: #121417;
      --bg-card: #1c1f24;
      --border-card: #2c3038;
      --text-main: #f1f3f5;
      --text-muted: #adb5bd;
      --status-bg: #163020;
      --status-text: #4ade80;
      --btn-gray: #6c727f;
      --btn-gray-hover: #5a606b;
      --btn-red-bg: #332020;
      --btn-red-text: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 720px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--status-bg);
      color: var(--status-text);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #0b0c0e;
      border-radius: 12px;
      border: 1px solid var(--border-card);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 1rem;
    }

    .info-row {
      color: var(--text-muted);
    }

    .info-row strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button, a.btn {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, background-color 0.2s;
    }

    .btn-primary {
      background-color: var(--btn-gray);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--btn-gray-hover);
    }

    .btn-danger {
      background-color: var(--btn-red-bg);
      color: var(--btn-red-text);
    }

    .btn-danger:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Psicose — Transmissão</h1>
      <span class="badge">
        <span class="dot"></span>
        <span>Online</span>
      </span>
    </div>

    <div class="video-container">
      <iframe id="ytPlayer" 
              src="" 
              title="YouTube video player" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
              allowfullscreen>
      </iframe>
    </div>

    <div class="info-list">
      <div class="info-row"><strong>Gateway (FGW):</strong> 192.168.1.254</div>
      <div class="info-row"><strong>Localização:</strong> 192.168.1.88</div>
      <div class="info-row"><strong>Endereço:</strong> aplica-opal.vercel.app</div>
      <div class="info-row"><strong>Canal:</strong> @AgentFOwca</div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="carregarDireto()">Ver Direto (Live)</button>
      <button class="btn-primary" onclick="carregarVideos()">Ver Últimos Vídeos</button>
      <a class="btn btn-primary" href="https://youtube.com" target="_blank" rel="noopener">Abrir no YouTube</a>
      <button class="btn-danger" onclick="window.history.back()">Voltar</button>
    </div>
  </div>

  <script>
    // IMPORTANTE: Substitui pelo ID real do canal @AgentFOwca (começa por UC...)
    const CHANNEL_ID = "UCxxxxxxxxxxxxxxxxxxxxxx"; 

    const player = document.getElementById("ytPlayer");

    // Carrega automaticamente a transmissão em direto ativa do canal
    function carregarDireto() {
      player.src = `https://youtube.com{CHANNEL_ID}&autoplay=1`;
    }

    // Carrega a playlist automática com todos os vídeos publicados pelo canal
    function carregarVideos() {
      // Para a playlist de uploads, troca o "UC" inicial do ID do canal por "UU"
      const uploadsPlaylist = "UU" + CHANNEL_ID.substring(2);
      player.src = `https://youtube.com{uploadsPlaylist}`;
    }

    // Inicia no modo direto ao abrir a página
    carregarDireto();
  </script>

</body>
</html>
