<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Site do Filipe - Login</title>
    <style>
        /* Estilos Gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Caixa de Autenticação */
        .auth-card {
            background: #fff;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-top: 5px solid #1abc9c;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* Formulários */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #34495e;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #1abc9c;
            outline: none;
        }
        .btn-submit {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #16a085;
        }
        .alert-msg {
            text-align: center;
            color: #e74c3c;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1>O Site do Filipe</h1>
        <p class="subtitle">Controlo de Acesso Geral - PAP</p>

        <div id="login-error" class="alert-msg"></div>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-user">Utilizador</label>
                <input type="text" id="login-user" required placeholder="Insira o seu utilizador">
            </div>
            <div class="form-group">
                <label for="login-pass">Palavra-passe</label>
                <input type="password" id="login-pass" required placeholder="Insira a sua password">
            </div>
            <button type="submit" class="btn-submit">Entrar</button>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value;
            const errorDiv = document.getElementById('login-error');
            errorDiv.innerText = '';

            const SUPABASE_URL = "https://supabase.co";
            const SUPABASE_KEY = "sb_publishable_vhFbJkkFV4AZ_EP-XuRiqQ_jm-cIYw6";

            // Tentativa 1: Procurar na tabela "utilizadores" (minúsculo)
            let response = await fetch(`${SUPABASE_URL}/rest/v1/utilizadores?username=eq.${encodeURIComponent(user)}&select=*`, {
                method: 'GET',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
            });
            
            let users = await response.json();

            // Tentativa 2: Se falhar, procurar na tabela "Utilizadores" (com U maiúsculo)
            if (!response.ok || (users && users.error)) {
                response = await fetch(`${SUPABASE_URL}/rest/v1/Utilizadores?username=eq.${encodeURIComponent(user)}&select=*`, {
                    method: 'GET',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }
                });
                users = await response.json();
            }

            try {
                if (!response.ok || !users || users.length === 0) {
                    errorDiv.innerText = 'Utilizador ou palavra-passe incorretos.';
                    return;
                }

                const userData = users[0];

                if (pass === userData.password) {
                    alert(`Sessão iniciada com sucesso. Bem-vindo, ${userData.username}!`);
                } else {
                    errorDiv.innerText = 'Utilizador ou palavra-passe incorretos.';
                }
            } catch (err) {
                errorDiv.innerText = 'Utilizador ou palavra-passe incorretos.';
            }
        }
    </script>
</body>
</html>
