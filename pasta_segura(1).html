<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Avançado: Inventário & Periféricos</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0b0c; color: #f5f5f7; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2c2c2e; padding-bottom: 15px; margin-bottom: 20px; }
        h1, h2, h3 { font-weight: 500; margin: 0; }
        h1 { font-size: 24px; color: #0a84ff; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: 1fr 2fr; } }
        .card { background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 12px; padding: 20px; }
        .device-item { padding: 12px; background: #2c2c2e; border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
        .device-item:hover, .device-item.active { border-color: #0a84ff; background: #3a3a3c; }
        .device-item h4 { margin: 0 0 5px 0; font-weight: 500; }
        .device-item p { margin: 0; font-size: 13px; color: #8e8e93; }
        .badge { display: inline-block; padding: 2px 6px; font-size: 11px; border-radius: 4px; font-weight: 600; text-transform: uppercase; margin-top: 5px; }
        .badge.network { background: rgba(10, 132, 255, 0.2); color: #0a84ff; }
        .badge.usb { background: rgba(48, 209, 88, 0.2); color: #30d158; }
        .badge.storage { background: rgba(255, 159, 10, 0.2); color: #ff9f0a; }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2c2c2e; font-size: 14px; }
        .detail-row span:first-child { color: #8e8e93; }
        .detail-row span:last-child { font-weight: 500; font-family: monospace; }
        .folder-list { list-style: none; padding: 0; margin: 5px 0 0 0; font-family: monospace; font-size: 13px; color: #30d158; }
        .folder-list li { padding: 3px 0; display: flex; align-items: center; gap: 6px; }
        .btn { background: #0a84ff; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Análise de Periféricos & Rede</h1>
            <p style="color: #8e8e93; margin: 5px 0 0 0; font-size: 14px;">Mapeamento completo de IPs, Portas, Protocolos e Pastas do Sistema.</p>
        </div>
        <button class="btn" onclick="atualizarDados()">Fazer Scan</button>
    </header>

    <div class="grid">
        <!-- Lista de Periféricos -->
        <div class="card">
            <h3 style="margin-bottom: 15px;">Dispositivos Detetados</h3>
            <div id="deviceList"></div>
        </div>

        <!-- Painel de Detalhes Completo -->
        <div class="card" id="detailPanel">
            <h3 style="margin-bottom: 15px; color: #8e8e93;">Selecione um periférico para ver o mapeamento</h3>
        </div>
    </div>
</div>

<script>
    // Banco de dados completo contendo todos os detalhes de hardware, rede e sistema de arquivos
    const perifericos = [
        {
            id: 1,
            nome: "Impressora Multifuncional Escritório",
            tipo: "Rede",
            badgeClass: "network",
            ip: "192.168.1.150",
            mac: "00:11:22:AA:BB:CC",
            porta: "9100 (RAW) / 631 (IPP)",
            status: "Online",
            pastas: [
                "C:/ProgramData/HP/Printers/Queue_150/",
                "/var/spool/cups/ (Linux Shared)",
                "//192.168.1.150/Scans_Partilhados/"
            ],
            detalhes: {
                "Fabricante": "HP",
                "Modelo": "LaserJet Pro MFP M428fdw",
                "Protocolo de Comunicação": "TCP/IP v4",
                "Sub-rede / Gateway": "255.255.255.0 / 192.168.1.1",
                "Firmware Versão": "CLEDBXLN1N001.2135A",
                "Buffer de Memória": "512 MB DDR"
            }
        },
        {
            id: 2,
            nome: "Disco Externo SSD de Backup",
            tipo: "Armazenamento",
            badgeClass: "storage",
            ip: "Não Aplicável (Local USB)",
            mac: "N/A",
            porta: "USB 3.2 Gen 2 (Type-C)",
            status: "Montado",
            pastas: [
                "D:/Backup_Sistema/Imagens_Cofre/",
                "D:/Logs_Auditoria/2026/",
                "/media/user/SSD_Secure/Câmara_Ficheiros/"
            ],
            detalhes: {
                "Fabricante": "Crucial",
                "Modelo": "X8 Portable SSD 2TB",
                "Sistema de Ficheiros": "exFAT / NTFS",
                "Velocidade de Leitura": "Até 1050 MB/s",
                "ID de Instância do Dispositivo": "USB\\VID_0634&PID_5678\\123456789ABC",
                "Letra de Unidade Padrão": "D: (Montagem Automática)"
            }
        },
        {
            id: 3,
            nome: "Câmara de Segurança IP (Cofre)",
            tipo: "Rede",
            badgeClass: "network",
            ip: "192.168.1.88",
            mac: "A4:C1:38:DE:7F:42",
            porta: "554 (RTSP) / 80 (HTTP)",
            status: "A transmitir",
            pastas: [
                "//192.168.1.88/sdcard/recordings/",
                "C:/Pasta_Segura/Stream_Cofre/Capturas/",
                "//Nas_Servidor/Seguranca/Camara_Principal/"
            ],
            detalhes: {
                "Fabricante": "Hikvision",
                "Modelo": "DS-2CD2143G0-I",
                "Codec de Vídeo": "H.265+ / MJPEG Stream",
                "Resolução Nativa": "2560x1440 @ 30fps",
                "Autenticação de Rede": "Digest MD5 / TLS 1.3",
                "Tipo de Stream": "Fluxo RTSP Unicast Permanente"
            }
        },
        {
            id: 4,
            nome: "Hub USB Inteligente & Controlador",
            tipo: "Periférico",
            badgeClass: "usb",
            ip: "Não Aplicável",
            mac: "N/A",
            porta: "PCI Express Root Complex",
            status: "Ativo",
            pastas: [
                "C:/Windows/System32/drivers/usbhub.sys",
                "C:/Program Files/DeviceController/Profiles/"
            ],
            detalhes: {
                "Fabricante": "Realtek Semiconductor",
                "Modelo": "USB 3.0 Extensible Host Controller",
                "Versão de Driver": "10.0.22621.1",
                "Corrente de Energia": "900mA Máx por porta",
                "Classe de Hardware": "USBHUB3 (Universal Serial Bus)"
            }
        }
    ];

    function carregarLista() {
        const listDiv = document.getElementById('deviceList');
        listDiv.innerHTML = "";
        perifericos.forEach(p => {
            const item = document.createElement('div');
            item.className = 'device-item';
            item.innerHTML = `
                <h4>${p.nome}</h4>
                <p>IP: ${p.ip}</p>
                <span class="badge ${p.badgeClass}">${p.tipo}</span>
            `;
            item.onclick = () => mostrarDetalhes(p.id, item);
            listDiv.appendChild(item);
        });
    }

    function mostrarDetalhes(id, element) {
        // Remove classe ativa de outros itens
        document.querySelectorAll('.device-item').forEach(el => el.classList.remove('active'));
        if(element) element.classList.add('active');

        const p = perifericos.find(item => item.id === id);
        const panel = document.getElementById('detailPanel');
        
        let pastasHTML = p.pastas.map(f => `<li>📂 ${f}</li>`).join('');
        let detalhesHTML = "";
        for (const [key, val] of Object.entries(p.detalhes)) {
            detalhesHTML += `
                <div class="detail-row">
                    <span>${key}</span>
                    <span>${val}</span>
                </div>
            `;
        }

        panel.innerHTML = `
            <h2 style="color: #0a84ff; margin-bottom: 5px;">${p.nome}</h2>
            <span class="badge ${p.badgeClass}" style="margin-bottom: 20px;">${p.tipo}</span>
            
            <h3 style="font-size:16px; margin-bottom:10px; color:#ff9f0a;">🔗 Detalhes de Endereçamento & Conexão</h3>
            <div class="detail-row"><span>Endereço IP</span><span>${p.ip}</span></div>
            <div class="detail-row"><span>Endereço MAC</span><span>${p.mac}</span></div>
            <div class="detail-row"><span>Portas de Comunicação / Interface</span><span>${p.porta}</span></div>
            <div class="detail-row"><span>Estado Operacional</span><span style="color:${p.status === 'Online' || p.status === 'A transmitir' || p.status === 'Ativo' ? '#30d158' : '#ff9f0a'}">${p.status}</span></div>
            
            <h3 style="font-size:16px; margin-top:20px; margin-bottom:10px; color:#0a84ff;">🛠️ Especificações Técnicas de Hardware</h3>
            ${detalhesHTML}

            <h3 style="font-size:16px; margin-top:20px; margin-bottom:10px; color:#30d158;">📁 Diretórios e Pastas do Sistema Vinculados</h3>
            <ul class="folder-list">
                ${pastasHTML}
            </ul>
        `;
    }

    function atualizarDados() {
        alert("A efetuar varrimento ARP e análise do sistema de ficheiros... Inventário atualizado!");
        carregarLista();
    }

    // Inicialização
    carregarLista();
    if(perifericos.length > 0) {
        setTimeout(() => {
            const primeiroItem = document.querySelector('.device-item');
            mostrarDetalhes(perifericos[0].id, primeiroItem);
        }, 100);
    }
</script>

</body>
</html>
